name: Bug Report · 问题反馈
description: 报告一个可复现的问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请先搜索是否已有相同 Issue，并在粘贴日志前自行脱敏（删除本机路径、内网 IP、API Key 与个人作品内容）。
  - type: input
    id: version
    attributes:
      label: 版本
      description: 祀音版本（如 1.0.0），或 commit hash
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - Windows 11
        - Windows 10
        - 其他（请在描述中说明）
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: 显卡 / 驱动
      placeholder: 例如 RTX 2060 / NVIDIA 5xx.xx
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: 1. ...\n2. ...\n3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 相关日志（已脱敏）
      description: app/logs/desktop.log、app/monitor/logs/*.log 等
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我已搜索过现有 Issue，未发现重复
          required: true
        - label: 我已对日志与截图中的敏感信息（路径 / IP / Key / 作品内容）脱敏
          required: true
